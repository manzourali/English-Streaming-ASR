experiment:
  name: surt_streaming_evaluation
  seed: 42
runtime:
  environment: auto
  device: auto
frozen_system:
  git_commit: auto
  surt_checkpoint: null
  finetuned_surt_checkpoint: null
  streaming_config: configs/multitalker.yaml
  training_config: configs/training.yaml
  train_manifest: data/manifests/train.jsonl
  validation_manifest: data/manifests/validation.jsonl
  test_manifest: data/manifests/test.jsonl
evaluation:
  input_records: []
  bootstrap_iterations: 1000
  test_set_protected: true
  external_dataset: null
  strata: [overlap_regime, temporal_condition]
systems:
  primary: [surt_base, surt_finetuned]
  oracle: []
ablations:
  - name: surt_base
    multitalker: true
    finetuned: false
  - name: surt_finetuned
    multitalker: true
    finetuned: true
