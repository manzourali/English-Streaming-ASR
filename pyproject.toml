[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-streaming-asr-overlap"
version = "0.1.0"
description = "Research infrastructure for Persian language adaptation of streaming multi-talker SURT 2.0."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
kaggle = ["soundfile>=0.14", "huggingface_hub>=0.20", "sentencepiece>=0.2.0"]
surt = ["torch>=2.1", "sentencepiece>=0.1.99"]
audio = ["soundfile>=0.12"]
phase1 = ["datasets>=2.0", "huggingface_hub>=0.20", "soundfile>=0.12"]
phase2 = ["webrtcvad-wheels>=2.0.14"]
persian = ["hazm>=0.10", "num2words>=0.5.13", "sentencepiece>=0.1.99"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an externally configured multi-talker model"]
